<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/todos-planos.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../img/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Todos os planos</title>
  </head>

  <body>
    <div id="navbar-placeholder"></div>
    <div id="page-content">
      <header>
        <h1 class="titlePage">Todos os planos</h1>
      </header>
      <main class="listaTodosPlanos">
        <!-- Busca por nome e filtro de status -->
        <div class="filtrosTodosPlanos">
          <input
            type="search"
            id="buscaTodosPlanos"
            placeholder="Buscar plano..."
            aria-label="Buscar plano pelo nome"
          >
          <select id="statusTodosPlanos" aria-label="Filtrar planos por status">
            <option value="">Todos os status</option>
            <option>Em dia</option>
            <option>Atrasado</option>
          </select>

          <!-- Abre o mesmo formulário de quatro etapas já existente -->
          <a class="botaoNovo" href="novo-plano.html">+ Novo plano</a>
        </div>

        <!-- Linhas preenchidas pelo JavaScript conforme os filtros -->
        <div class="rolagemTodosPlanos">
          <table class="tabelaTodosPlanos">
            <thead>
              <tr>
                <th scope="col">Nome do plano</th>
                <th scope="col">Tipo</th>
                <th scope="col">Equipamentos</th>
                <th scope="col">Última execução</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="corpoTodosPlanos"></tbody>
          </table>
        </div>
        <p id="mensagemTodosPlanos" role="status" hidden>
          Nenhum plano encontrado com esses filtros.
        </p>
        <a class="voltarTodosPlanos" href="planomanutencao.html?aba=cronograma">
          ← Voltar ao Cronograma
        </a>
      </main>
      <footer>
        <p class="m-0">&copy; 2026 • <strong>ElevAI</strong> • Inteligência que eleva a sua operação</p>
      </footer>
    </div>
    <script type="module">
      import { carregarNavbar } from "../js/scripts.js";
      carregarNavbar();
    </script>
    <script src="../js/todos-planos.js"></script>
  </body>
</html>
