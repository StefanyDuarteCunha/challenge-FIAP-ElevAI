<head>
    <meta charset="UTF-8">

	<link href="../css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body class="bodyLogin">
	<header>
      <nav class="navIndex">
        <div class="navOrganizacao">
            <a href="../index.html" target="conteudo"><img class="navIndexLogo" src="../img/logoBranca.png"
            alt="Logo do site"></a>
        </div>
        <div class="navIndexLinks navOrganizacao">
          <a href="/pages/solucao.html" target="conteudo" class="navIndexText">Solução</a>
          <a href="/pages/recursos.html" target="conteudo" class="navIndexText">Recursos</a>
          <a href="/pages/beneficios.html" target="conteudo" class="navIndexText">Benefícios</a>
          <a href="/pages/publico.html" target="conteudo" class="navIndexText">Público Alvo</a>
          <a href="/pages/faleConosco.html" target="conteudo" class="navIndexText">Contato</a>
        </div>
        <div class="navOrganizacao">
            <a class="navIndexButton inactive">Acessar plataforma</a>
        </div>
      </nav>
    </header>
	<main class="mainLogin">
		<div class="loginImagemFundo">
			<div class="caixaLogin">
				<div class="conteudoCaixaLogin">
					<h1 class="titleLogin">Elev<span>AI</span></h1>
					<h2 class="subtitleLogin m-0">Inteligência que eleva o </h2>
					<h2 class="subtitleLogin m-0">gerenciamento de elevadores</h2>
				</div>
			</div>
			<div class="caixaLogin esquerda">
				<div class="conteudoCaixaLogin background">
					<form class="forms-login" action="dashboard.html">
						<div>
							<label for="email" class="form-label loginLabel">E-mail</label>
							<input type="email" class="form-control" id="email" placeholder="name@example.com"
								pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Digite o email no formato nome@example.com" required>
						</div>
						<div class="spaceLogin">
							<label for="inputPassword" class="col-form-label loginLabel">Senha</label>
							<input type="password" class="form-control" id="inputPassword" placeholder="**********" required>
						</div>
						<div class="loginButton">
							<div class="container-botao">
								<button type="submit" class="navIndexButton">Enviar</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</main>
	<footer>
		<p class="footerWhite m-0">&copy; 2026 • <strong>ElevAI</strong> • Inteligência que eleva a sua operação<p>
	</footer>
</body>
