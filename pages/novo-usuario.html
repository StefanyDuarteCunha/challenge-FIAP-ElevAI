<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/configuracoes.css" rel="stylesheet" />
    <link href="../css/usuarios.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../img/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Novo usuário</title>
  </head>

  <body>
    <div id="navbar-placeholder"></div>

    <div id="page-content">
      <header>
        <h1 class="titlePage">Novo usuário</h1>
        <p class="subtitlePage">Preencha os dados para cadastrar um usuário.</p>
      </header>

      <main>
        <!-- Volta para a tela de configurações -->
        <a href="configuracoes.html" class="linkVoltarUsuario">
          <i class="bi bi-arrow-left"></i> Voltar para usuários
        </a>

        <!-- Formulário de cadastro -->
        <form
          class="formularioUsuario mt-3"
          action="configuracoes.html"
          method="get"
        >
          <!-- Nome -->
          <label for="nomeUsuario" class="rotuloCampo">
            Nome completo
          </label>

          <input
            class="inputConfig"
            id="nomeUsuario"
            name="nome"
            type="text"
            required
          />

          <!-- E-mail -->
          <label for="emailUsuario" class="rotuloCampo">
            E-mail
          </label>

          <input
            class="inputConfig"
            id="emailUsuario"
            name="email"
            type="email"
            required
          />

          <!-- Perfil -->
          <label for="perfilUsuario" class="rotuloCampo">
            Perfil
          </label>

          <select
            class="seletorConfig"
            id="perfilUsuario"
            name="perfil"
            required
          >
            <option value="">Selecione um perfil</option>
            <option value="Administrador">Administrador</option>
            <option value="Gestor">Gestor</option>
            <option value="Técnico">Técnico</option>
          </select>

          <!-- Status -->
          <label for="statusUsuario" class="rotuloCampo">
            Status
          </label>

          <select
            class="seletorConfig"
            id="statusUsuario"
            name="status"
            required
          >
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>

          <!-- Botões -->
          <div class="acoesFormularioUsuario">
            <button class="btn btn-primary rounded-pill" type="submit">
              Cadastrar usuário
            </button>

            <a
              class="btn btn-outline-secondary rounded-pill"
              href="configuracoes.html"
            >
              Cancelar
            </a>
          </div>
        </form>
      </main>

      <footer>
        <p class="m-0">
          &copy; 2026 • <strong>ElevAI</strong> • Inteligência que eleva a sua operação
        </p>
      </footer>
    </div>

    <script type="module" src="../js/novo-usuario.js"></script>
  </body>
</html>
