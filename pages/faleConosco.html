<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link href="../css/style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Fale Conosco</title>
</head>
<body class="bodyLogin">
	<header>
      <nav class="navIndex">
        <div class="navOrganizacao">
            <a href="../index.html" target="conteudo"><img class="navIndexLogo" src="../img/logoBranca.png"
            alt="Logo do site"></a>
        </div>
       	<div class="navIndexLinks navOrganizacao">
          <a href="beneficios.html" target="_parent" class="navIndexText">Solução</a>
          <a href="recursos.html" target="_parent" class="navIndexText">Recursos</a>
          <a href="beneficios.html" target="_parent" class="navIndexText">Benefícios</a>
          <a href="publico.html" target="_parent" class="navIndexText">Público Alvo</a>
          <a href="faleConosco.html" target="_parent" class="navIndexText">Contato</a>
        </div>
        <div class="navOrganizacao">
            <a href="login.html" target="_parent" class="navIndexButton">Acessar plataforma</a>
        </div>
      </nav>
    </header>
	<main class="mainLogin">
		<div class="faleImagemFundo">
			<div class="caixaFale30">
				<div class="cardFale">
                    <i class="bi bi-clipboard-data iconIndex"></i>
                    <div>
                        <p class="pbold mt-0 mb-1">Telefone</p>
                        <p class="m-0">+55 31 99849-3265</p>
                    </div>
                </div>
				<div class="cardFale">
                    <i class="bi bi-clipboard-data iconIndex"></i>
                    <div>
                        <p class="pbold mt-0 mb-1">E-mail</p>
                        <p class="m-0">faleconosco@elevai.com.br</p>
                    </div>
                </div>
				<div class="cardFale">
                    <i class="bi bi-clipboard-data iconIndex"></i>
                    <div>
                        <p class="pbold mt-0 mb-1">Horário de atendimento</p>
                        <p class="m-0">Segunda a sexta</p>
						<p class="m-0">08h às 18h</p>
                    </div>
                </div>
			</div>
			<div class="caixaFale70">
				<div class="conteudoCaixaFale">
					<form class="forms-login" id="formulario_JS">
						<div class="lineFale">
							<div class="campoFale">
								<label for="nomecompleto" class="form-label loginLabel">Nome Completo</label>
								<input type="text" class="form-control" id="nomecompleto" pattern="^[A-Za-zÀ-ÿ]{2,}(?:\s+[A-Za-zÀ-ÿ]{2,})+$" title="Digite o nome e sobrenome com pelo menos 2 letras em cada" placeholder="Digite o seu nome e sobrenome" required>
							</div>
							<div class="campoFale">
								<label for="empresa" class="form-label loginLabel">Empresa</label>
								<input type="text" class="form-control" id="empresa" pattern="^[A-Za-zÀ-ÿ]{2,}+$" title="Digite o nome da empresa" placeholder="Digite o seu nome e sobrenome" required>
							</div>
						</div>
						<div class="lineFale">
							<div class="campoFale">
								<label for="email" class="form-label loginLabel">E-mail</label>
								<input type="email" class="form-control" id="email" placeholder="name@example.com" pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Digite o email no formato nome@example.com" required>
							</div>
							<div class="campoFale">
								<label for="telefone" class="form-label loginLabel">Número de Celular</label>
								<input type="tel" class="form-control" id="telefone" placeholder="(99) 99999-9999" maxlength="15" pattern="^\(\d{2}\)\s\d{4,5}-\d{4}$" title="Digite o ddd e o número de telefone completo" required>
							</div>
						</div>
						<div class="lineFale">
							<div class="campoFale">
								<label for="assunto" class="form-label loginLabel">Motivo do contato</label>
								<select id="assunto" class="form-control">
									<option value="blank"></option>
									<option value="atendimento">Atendimento comercial </option>
									<option value="financeiro">Financeiro / Cobrança</option>
									<option value="implantacao">Implantação / Treinamento</option>
									<option value="parcerias">Parcerias</option>
									<option value="privacidade">Privacidade e dados</option>
									<option value="reportar">Reportar problemas</option>
									<option value="sugestao">Sugestões de melhoria</option>
									<option value="suporte">Suporte técnico</option>
									<option value="outros">Outros</option>
								</select>
							</div>
							<div class="campoFale">
								<label for="contato" class="form-label loginLabel">Primeiro contato?</label>
								<select id="contato" class="form-control">
									<option value="blank"></option>
									<option value="sim">Sim</option>
									<option value="nao">Não</option>
								</select>
							</div>
						</div>
						<div>
							<label for="textMensagem" class="form-label loginLabel">Mensagem</label>
							<textarea class="form-control" id="textMensagem" rows="3" maxlength="500" required></textarea>
							<p class="contCaracteres mt-2 mb-0"><span id="contadorCaracteres">0</span>/500 caracteres</p>
						</div>
						<div class="loginButton end">
							<div class="container-botao">
								<button type="submit" id="submit_botao" class="navIndexButton">Enviar Mensagem</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</main>
	<footer>
		<p class="footerWhite m-0">&copy; 2026 • <strong>ElevAI</strong> • Inteligência que eleva a sua operação<p>
	</footer>
	<script>
		document.getElementById("formulario_JS").addEventListener("submit", function (e) {
			e.preventDefault();
			alert("Mensagem encaminhada com sucesso!");
			this.reset();
		});

		/* Responsável por contar os caracteres da mensagem */
		const campoMensagem = document.getElementById("textMensagem");
		const contador = document.getElementById("contadorCaracteres");
		campoMensagem.addEventListener("input", () => {
			contador.textContent = campoMensagem.value.length;
		});
		
		document.getElementById('telefone').addEventListener('input', function (e) {
			let value = e.target.value.replace(/\D/g, '');
			value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
			value = value.replace(/(\d{5})(\d)/, '$1-$2');
			e.target.value = value;
		});
	</script>
</body>
</html>
